# Render Blueprint — CAMPUSCONNECT

services:
  - type: web
    name: campusconnect
    runtime: node
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && cd .. && npm run build
    startCommand: cd server && node_modules/.bin/prisma generate && node_modules/.bin/prisma db push && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
